gui:
  # Catppuccin Mocha, matching lazygit/config.yml key for key. lazydocker's
  # gui.theme supports exactly these four keys (see its docs/Config.md);
  # lazygit-only keys such as selectedRangeBgColor are silently ignored here,
  # so they are deliberately absent rather than left in looking effective.
  theme:
    activeBorderColor:
      - '#fab387' # peach
      - bold
    inactiveBorderColor:
      - '#a6adc8' # subtext0
    optionsTextColor:
      - '#89b4fa' # blue
    selectedLineBgColor:
      - '#313244' # surface0
  scrollHeight: 2
  language: 'auto'
  # 'rounded' | 'single' | 'double' | 'hidden'. single matches nvim's
  # vim.g.border_style and tmux's pane borders.
  border: 'single'

commandTemplates:
  dockerCompose: docker compose

# Graph series colours encode data, not chrome, so they stay distinct from the
# accent above.
stats:
  graphs:
    - caption: CPU (%)
      statPath: DerivedStats.CPUPercentage
      color: '#89b4fa' # blue
    - caption: Memory (%)
      statPath: DerivedStats.MemoryPercentage
      color: '#a6e3a1' # green
