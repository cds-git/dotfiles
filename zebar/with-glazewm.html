<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
        useRef,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3';

      const providers = zebar.createProviderGroup({
        // refreshInterval is in milliseconds. Every polling provider already
        // defaults to a sane one, so these are spelled out only to keep the
        // bar's update rates readable in one place; weather is left alone so
        // its API is not hammered. audio and glazewm are push-based instead:
        // they take no interval and emit whenever the thing they watch
        // actually changes, which is why audio stays live.
        network: { type: 'network', refreshInterval: 5000 },
        glazewm: { type: 'glazewm' },
        audio: { type: 'audio' },
        date: { type: 'date', formatting: 'EEEE d MMM HH:mm' },
        battery: { type: 'battery', refreshInterval: 60000 },
        keyboard: { type: 'keyboard', refreshInterval: 1000 },
        weather: { type: 'weather' },
      });

      // Zebar exposes no Bluetooth provider, and there is little a bar running
      // here could do with one: this session is an RDP session, where Windows
      // hides the machine's real endpoints behind a single "Remote Audio"
      // device and ships the sound down to the connecting client. A headset
      // paired to the machine itself never appears in session, so its state is
      // not the bar's to report. What the bar can say is where sound is
      // actually leaving by, which is the question that changes day to day.
      const REMOTE_DEVICE = /remote audio/i;
      const HEADSET_DEVICE =
        /bluetooth|hands-free|headset|headphone|earbud|airpod/i;

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        // Get icon to show for current network status.
        function getNetworkIcon(networkOutput) {
          switch (networkOutput.defaultInterface?.type) {
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            case 'wifi':
              if (networkOutput.defaultGateway?.signalStrength >= 80) {
                return <i className="nf nf-md-wifi_strength_4"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 65
              ) {
                return <i className="nf nf-md-wifi_strength_3"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 40
              ) {
                return <i className="nf nf-md-wifi_strength_2"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 25
              ) {
                return <i className="nf nf-md-wifi_strength_1"></i>;
              } else {
                return <i className="nf nf-md-wifi_strength_outline"></i>;
              }
            default:
              return (
                <i className="nf nf-md-wifi_strength_off_outline"></i>
              );
          }
        }

        // Get icon to show for how much of the battery is charged.
        function getBatteryIcon(batteryOutput) {
          if (batteryOutput.chargePercent > 90)
            return <i className="nf nf-fa-battery_4"></i>;
          if (batteryOutput.chargePercent > 70)
            return <i className="nf nf-fa-battery_3"></i>;
          if (batteryOutput.chargePercent > 40)
            return <i className="nf nf-fa-battery_2"></i>;
          if (batteryOutput.chargePercent > 20)
            return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        // Get icon to show for current weather status.
        function getWeatherIcon(weatherOutput) {
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
              return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night':
              return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
              return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night':
              return <i className="nf nf-weather-night_alt_lightning"></i>;
          }
        }

        // Zebar can only shell out if the widget declares shell privileges,
        // but GlazeWM can already, and the bar is talking to it regardless.
        function runScript(script) {
          output.glazewm?.runCommand(
            `shell-exec powershell -NoProfile -WindowStyle Hidden -File %userprofile%\\dotfiles\\zebar\\${script}`,
          );
        }

        // Wheel ticks arrive far faster than the provider echoes a volume
        // change back, so several in a row would all compute from the same
        // stale reading and move the volume by one step instead of five.
        // Steer from a local target until the provider catches up.
        const targetVolume = useRef(null);
        const [displayVolume, setDisplayVolume] = useState(null);

        useEffect(() => {
          const device = output.audio?.defaultPlaybackDevice;
          if (
            targetVolume.current !== null &&
            device &&
            Math.round(device.volume) === targetVolume.current
          ) {
            targetVolume.current = null;
            setDisplayVolume(null);
          }
        }, [output.audio]);

        function nudgeVolume(delta) {
          const device = output.audio?.defaultPlaybackDevice;
          if (!device) return;
          const from = targetVolume.current ?? device.volume;
          const next = Math.min(100, Math.max(0, Math.round(from + delta)));
          targetVolume.current = next;
          setDisplayVolume(next);
          output.audio.setVolume(next);
        }

        function toggleMute() {
          const device = output.audio?.defaultPlaybackDevice;
          if (device) output.audio.setMute(!device.isMuted);
        }

        // The icon carries the device, not the level -- the percentage
        // already says how loud it is, and what it is coming out of is the
        // part a number cannot tell you. Over RDP that is nearly always the
        // remote endpoint; the other two cases are for sitting at the machine.
        function getAudioIcon(device) {
          if (device.isMuted) return 'nf-md-volume_off';
          if (REMOTE_DEVICE.test(device.name)) return 'nf-md-monitor_speaker';
          if (HEADSET_DEVICE.test(device.name)) return 'nf-md-headphones';
          return 'nf-md-volume_high';
        }

        // The provider reports a locale tag such as 'en-US' or 'da-DK'. Show
        // just the language, which is the part that actually changes here.
        function formatLayout(layout) {
          if (!layout) return '';
          // The provider returns the raw wide string including its NUL
          // terminator (e.g. 'en-US\0', 'da\0'), so strip control characters
          // before doing anything else or they end up rendered.
          const clean = String(layout)
            .replace(/[\u0000-\u001f]/g, '')
            .trim();
          if (!clean) return '';
          const lang = clean.split(/[-_]/)[0];
          return lang.length <= 3 ? lang.toUpperCase() : clean;
        }

        return (
          <div className="app">
            <div className="left">
              <i className="logo nf nf-fa-windows"></i>
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(workspace => (
                    <button
                      className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `focus --workspace ${workspace.name}`,
                        )
                      }
                      key={workspace.name}
                    >
                      {workspace.displayName ?? workspace.name}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div
              className="center clock"
              title="Open notification centre and calendar"
              onClick={() => runScript('open-calendar.ps1')}
            >
              {output.date?.formatted}
            </div>

            <div className="right">
              {output.glazewm && (
                <>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() => glazewm.runCommand('wm-toggle-pause')}
                    >
                      PAUSED
                    </button>
                  )}
                  {output.glazewm.bindingModes.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}

                  <button
                    className={`tiling-direction nf ${output.glazewm.tilingDirection === 'horizontal' ? 'nf-md-swap_horizontal' : 'nf-md-swap_vertical'}`}
                    onClick={() =>
                      output.glazewm.runCommand('toggle-tiling-direction')
                    }
                  ></button>
                </>
              )}

              {output.keyboard && (
                <div className="keyboard">
                  <i className="nf nf-md-keyboard_outline"></i>
                  {formatLayout(output.keyboard.layout)}
                </div>
              )}

              {output.network && (
                <div className="network">
                  {getNetworkIcon(output.network)}
                  {output.network.defaultGateway?.ssid}
                </div>
              )}

              {output.audio?.defaultPlaybackDevice && (
                <div
                  className={`audio ${output.audio.defaultPlaybackDevice.isMuted ? 'muted' : ''}`}
                  title={`${output.audio.defaultPlaybackDevice.name} - scroll to change volume, click to mute, right-click for sound settings`}
                  onWheel={e => nudgeVolume(e.deltaY < 0 ? 5 : -5)}
                  onClick={toggleMute}
                  onContextMenu={e => {
                    e.preventDefault();
                    runScript('open-quick-settings.ps1');
                  }}
                >
                  <i
                    className={`nf ${getAudioIcon(output.audio.defaultPlaybackDevice)}`}
                  ></i>
                  {displayVolume ??
                    Math.round(output.audio.defaultPlaybackDevice.volume)}
                  %
                </div>
              )}

              {output.battery && (
                <div className="battery">
                  {/* Show icon for whether battery is charging. */}
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent)}%
                </div>
              )}

              {output.weather && (
                <div className="weather">
                  {getWeatherIcon(output.weather)}
                  {Math.round(output.weather.celsiusTemp)}°C
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
