# GlazeWM config — Win (Super) as the mod key, to match a Linux tiling-WM
# setup: Super+arrows to focus, Super+Shift+arrows to move, Super+number for
# workspaces, and single-letter mnemonics for window state.
#
# Tuned for use over Azure RDP. Everything here is either a static DWM
# attribute (borders, corner style) or a one-off window move, both of which
# cost nothing per frame. Settings that would generate continuous frame or
# cursor traffic are turned off, each marked "RDP:" below with the value to
# use on a local machine.
#
# Modifier-namespace model (no cross-layer collisions by construction):
#   GlazeWM  -> Win/Super   (nothing in the terminal stack uses Win)
#   Terminal -> Ctrl+Shift   tmux -> Ctrl+Space prefix   nvim/TUIs -> Ctrl / Alt+letter / Space
#
# Win+L is genuinely unavailable: the lock screen is raised by winlogon before
# a user-mode keyboard hook ever runs, so nothing here can see it, let alone
# swallow it. Hence focus uses Win+arrows rather than hjkl.
#
# The other combos once listed here as unreachable — Win+Ctrl+arrows (virtual
# desktops), Win+Tab (Task View), Win+Space (input language), Win+G (Game Bar)
# — were an assumption, and two have since been measured wrong. Win+Tab is
# bound below and was tested: the hook swallowed it and Task View never
# appeared. Win+Space was tested the same way and also swallowed, leaving the
# input language untouched. Both results are what the hook implies, since it
# returns LRESULT(1) on a match and the shell then never receives the key.
# Treat the remaining two as untested rather than forbidden: bind one and try
# it before assuming.
#
# Win+Space is nonetheless left alone deliberately. It is the EN/DA switcher
# and worth more in that role than as a binding; PowerToys Run keeps Alt+Space.
# The legacy Alt+Shift switcher is turned off separately, in the install
# module, because it fires by accident constantly. Note that the two are
# independent: Alt+Shift lives in HKCU\Keyboard Layout\Toggle, while Win+Space
# is built into the shell and is not governed by that key.
#
# Shell hotkeys GlazeWM's low-level hook should win, but worth testing on a
# new machine: Win+W (Widgets), Win+T (taskbar), Win+J (snap hint), Win+O
# (orientation lock). Over RDP these only reach the remote session if the
# client's "Apply Windows key combinations" is set to the remote computer.
#
# No GlazeWM equivalent, so deliberately absent: scratchpad, window
# groups/tabs, Super+drag to move/resize, pseudo-tiling, and monitor scaling
# cycle. Ctrl+Alt+Del is the Windows secure attention sequence and cannot be
# bound by anything. Launcher, screenshots and lock live outside the WM:
# PowerToys Run, Win+Shift+S, Win+L.

general:
  # Zebar first, then lay out the applications once GlazeWM is up.
  startup_commands:
    - 'shell-exec zebar'
    - 'shell-exec powershell -NoProfile -WindowStyle Hidden -File %userprofile%\dotfiles\glazewm\ensure-layout.ps1 -InitialDelaySeconds 3'                       # optional bar; remove if unused
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  # RDP: keep false. Cursor position arrives with the connection's latency, so
  # focus-follows-mouse hands focus to whatever the stale pointer was over.
  # Locally, true gives the usual Linux focus-follows-mouse behaviour.
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    # RDP: 'monitor_focus' only. Warping the cursor desyncs it from the
    # client's own pointer, so keep it rare. Locally, 'window_focus' warps on
    # every window change, which is closer to a warping Linux WM.
    enabled: true
    trigger: 'monitor_focus'

# No gaps anywhere: windows sit flush against each other and against the screen
# edge.
#
# The top is the one exception, and it is not decoration: 26px is exactly
# Zebar's height, which is anchored top_left and full width. Without it tiled
# windows slide underneath the bar. It is the bar's height alone now, with no
# margin added, so windows sit directly beneath it. Change this number to match
# if you restyle the bar's height or move it.
gaps:
  scale_with_dpi: true
  inner_gap: '0px'
  outer_gap: { top: '26px', right: '0px', bottom: '0px', left: '0px' }

# Borders and corner style are DWM window attributes — set once per window,
# no per-frame cost, so they are safe over RDP. Both are Windows 11 only.
# GlazeWM has no border-width setting.
#
# RDP: leave transparency disabled. Layered windows are recomposited and
# resent on every change, which is the single most expensive effect over a
# remote session. Locally, `transparency: { enabled: true, opacity: '98.5%' }`
# on focused and '96%' on other windows gives the usual subtle inactive fade.
window_effects:
  focused_window:
    border: { enabled: true, color: '#8aadf4' }
    corner_style: { enabled: true, style: 'square' }
    transparency: { enabled: false, opacity: '98.5%' }
  other_windows:
    border: { enabled: true, color: '#6c7086' }
    corner_style: { enabled: true, style: 'square' }
    transparency: { enabled: false, opacity: '96%' }

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: true        # floating windows stay above tiled ones (the "pin" behaviour)
    fullscreen:
      maximized: false
      shown_on_top: true

# Ten workspaces: Win+1..9 then Win+0.
# Only the workspaces that have a pinned application get a home. The rest are
# deliberately left unbound, which makes them behave the way Hyprland's do:
# they materialise on whichever monitor has focus, so ad-hoc work opens where
# you are already looking instead of teleporting you somewhere else. GlazeWM
# also prefers unbound configs when it needs a workspace for a monitor that
# has just been connected, so they fill new screens on their own.
#
# bind_to_monitor is an INDEX, and monitors are sorted left-to-right by x
# position, then top-to-bottom -- not by Windows' device order and not by which
# one is primary. The index therefore tracks the physical arrangement:
#
#     0  portrait panel, far left   (nothing bound here, by choice)
#     1  centre screen, primary     -- main
#     2  right screen               -- secondary
#
# ---------------------------------------------------------------------------
# WHEN THE PORTRAIT PANEL GOES AWAY, EVERY INDEX BELOW SHIFTS DOWN BY ONE.
# It sits to the left of both other screens, so dropping it makes main 0 and
# secondary 1. Rewrite the four bindings as: main 1 -> 0, secondary 2 -> 1.
# There is no way to avoid this; bind_to_monitor takes no monitor name, as of
# 3.10.1 either, so the binding cannot be pinned to a display that keeps its
# identity across a change of arrangement.
# ---------------------------------------------------------------------------
#
# Fewer monitors needs no second config regardless. A workspace bound to an
# index that is not there falls back to the focused monitor, so over RDP on a
# single screen the whole set collapses onto it and behaves as it always did.
# Unplugging migrates a monitor's non-empty workspaces to a surviving screen;
# plugging it back in moves the bound ones home again. Both are automatic.
# Note that reloading this file does neither -- bindings apply when a
# workspace is created or a monitor appears, so an existing workspace stays
# where it is until something moves it.
#
# keep_alive on the bound four is what stops an RDP round-trip from wedging
# this. Without it an empty workspace is destroyed the moment it stops being
# displayed, and a monitor whose only workspace was empty is left holding none
# at all. That state cannot be undone from inside the WM: moving a workspace to
# a monitor needs a workspace already on it to swap with, so move-workspace
# fails with "No Workspace" and focus --monitor fails too, leaving every
# workspace stranded on one screen. A kept-alive workspace cannot be destroyed,
# so its monitor always has one and the deadlock cannot form. The cost is that
# these four always show in the bar, empty or not.
workspaces:
  - { name: '1',  bind_to_monitor: 2, keep_alive: true }   # firefox  -> secondary
  - { name: '2',  bind_to_monitor: 1, keep_alive: true }   # terminal -> main
  - { name: '3' }
  - { name: '4' }
  - { name: '5' }
  - { name: '6' }
  - { name: '7' }
  - { name: '8',  bind_to_monitor: 2, keep_alive: true }   # outlook  -> secondary
  - { name: '9' }
  - { name: '10', bind_to_monitor: 1, keep_alive: true }   # teams    -> main

window_rules:
  # Don't manage the bar.
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }

  # Auto-float dialogs and utility windows (matchers are OR'd).
  - commands: ['set-floating']
    match:
      - window_class: { equals: '#32770' }            # generic Win32 dialog (catches most modals)
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'SystemSettings' }  # Settings app
      - window_process: { equals: 'mmc' }             # management consoles
      - window_process: { equals: 'PickerHost' }      # file pickers
      - window_process: { equals: 'CalculatorApp' }
      # PiP / video example — float a Teams meeting window by title:
      # - window_process: { equals: 'ms-teams', window_title: { regex: 'Meeting' } }

  # The keybinding cheatsheet pops centered and on top instead of tiling.
  - commands: ['set-floating --centered --shown-on-top']
    match:
      - window_title: { regex: '^Keybindings' }

  # Application homes are not enforced with window rules any more. A rule
  # matches every window of a process forever, which yanks scratch terminals,
  # second browser windows and Teams meeting windows to a workspace you did
  # not want them on. glazewm/ensure-layout.ps1 places one instance of each
  # instead -- at startup and on demand via Win+Shift+H -- and leaves
  # everything you open afterwards exactly where you put it.

keybindings:
  # --- Window state ---
  # W=close, J=split direction, T=float, F=fullscreen.
  - { commands: ['close'],                      bindings: ['lwin+w'] }
  - { commands: ['toggle-tiling-direction'],    bindings: ['lwin+j'] }
  - { commands: ['toggle-floating --centered'], bindings: ['lwin+t'] }
  - { commands: ['toggle-fullscreen'],          bindings: ['lwin+f'] }
  # Escape hatch: put the window back in the tiling layout whatever state it is
  # in. The toggles above flip between two states each, so a window that is both
  # floating and fullscreen can be awkward to get back; this always works.
  - { commands: ['set-tiling'],                 bindings: ['lwin+shift+t'] }
  # Pin: a small always-on-top window in the top-right corner, for keeping a
  # meeting or a log in view while working underneath. The coordinates are for
  # a 2560x1440 monitor -- x = 2560 - 520 - 10 (right gap), y = 26 (bar) + 10.
  # Geometry has to go through the dedicated `size` and `position` commands:
  # set-floating's own --width/--x-pos are ignored on a window that is already
  # floating, and state_defaults.floating.centered re-centres it regardless.
  - { commands: ['set-floating --shown-on-top=true', 'size --width 520 --height 360', 'position --x-pos 2030 --y-pos 36'], bindings: ['lwin+o'] }
  # Focus moves within the tiling layout only, so a floating window is
  # otherwise unreachable by keyboard. This cycles focus between the tiling,
  # floating and fullscreen groups -- press it to jump to the pinned window and
  # again to come back. Win+Space would be the conventional key but Windows
  # reserves it for the input language.
  - { commands: ['wm-cycle-focus'],             bindings: ['lwin+shift+o'] }
  # Put one instance of each pinned application back on its workspace. Safe to
  # press any time; it only touches an application that is missing or astray.
  - { commands: ['shell-exec powershell -NoProfile -WindowStyle Hidden -File %userprofile%\dotfiles\glazewm\ensure-layout.ps1'], bindings: ['lwin+shift+h'] }

  # --- Focus and move ---
  # Arrows rather than hjkl, since Win+L would lock the screen.
  - { commands: ['focus --direction left'],  bindings: ['lwin+left'] }
  - { commands: ['focus --direction down'],  bindings: ['lwin+down'] }
  - { commands: ['focus --direction up'],    bindings: ['lwin+up'] }
  - { commands: ['focus --direction right'], bindings: ['lwin+right'] }

  - { commands: ['move --direction left'],  bindings: ['lwin+shift+left'] }
  - { commands: ['move --direction down'],  bindings: ['lwin+shift+down'] }
  - { commands: ['move --direction up'],    bindings: ['lwin+shift+up'] }
  - { commands: ['move --direction right'], bindings: ['lwin+shift+right'] }

  # Move the whole workspace to another monitor.
  - { commands: ['move-workspace --direction left'],  bindings: ['lwin+shift+alt+left'] }
  - { commands: ['move-workspace --direction down'],  bindings: ['lwin+shift+alt+down'] }
  - { commands: ['move-workspace --direction up'],    bindings: ['lwin+shift+alt+up'] }
  - { commands: ['move-workspace --direction right'], bindings: ['lwin+shift+alt+right'] }

  # --- Resize ---
  # 100px steps; Win+R enters a mode for repeated arrows or hjkl.
  - { commands: ['resize --width -100px'],  bindings: ['lwin+oem_minus'] }
  - { commands: ['resize --width +100px'],  bindings: ['lwin+oem_plus'] }
  - { commands: ['resize --height -100px'], bindings: ['lwin+shift+oem_minus'] }
  - { commands: ['resize --height +100px'], bindings: ['lwin+shift+oem_plus'] }
  - { commands: ['wm-enable-binding-mode --name resize'], bindings: ['lwin+r'] }

  # --- Launchers ---
  - { commands: ['shell-exec wt'],             bindings: ['lwin+enter'] }        # terminal
  - { commands: ['shell-exec msedge'],         bindings: ['lwin+shift+enter'] }  # browser; swap for chrome/firefox
  - { commands: ['shell-exec msedge'],         bindings: ['lwin+shift+b'] }
  - { commands: ['shell-exec explorer'],       bindings: ['lwin+shift+f'] }      # file manager
  - { commands: ['shell-exec wt -p WSL nvim'], bindings: ['lwin+shift+n'] }      # editor

  # --- WM control ---
  - { commands: ['wm-reload-config'], bindings: ['lwin+shift+r'] }
  - { commands: ['wm-exit'],          bindings: ['lwin+shift+e'] }
  # Cheatsheet, in the spirit of tmux's prefix+?. The script parses this very
  # file, so the list cannot drift from the bindings below.
  - { commands: ['shell-exec wt --title Keybindings pwsh -NoLogo -NoProfile -File %userprofile%\dotfiles\glazewm\show-keybindings.ps1'], bindings: ['lwin+shift+oem_question'] }

  # --- Workspaces ---
  - { commands: ['focus --workspace 1'],  bindings: ['lwin+1'] }
  - { commands: ['focus --workspace 2'],  bindings: ['lwin+2'] }
  - { commands: ['focus --workspace 3'],  bindings: ['lwin+3'] }
  - { commands: ['focus --workspace 4'],  bindings: ['lwin+4'] }
  - { commands: ['focus --workspace 5'],  bindings: ['lwin+5'] }
  - { commands: ['focus --workspace 6'],  bindings: ['lwin+6'] }
  - { commands: ['focus --workspace 7'],  bindings: ['lwin+7'] }
  - { commands: ['focus --workspace 8'],  bindings: ['lwin+8'] }
  - { commands: ['focus --workspace 9'],  bindings: ['lwin+9'] }
  - { commands: ['focus --workspace 10'], bindings: ['lwin+0'] }

  # Cycle only the workspaces actually in use, not all ten, and only the ones
  # on the monitor being looked at. The plain --next-active-workspace walks
  # every active workspace on every screen, which with workspaces bound to
  # monitors means Win+Tab quietly hauls focus onto another display mid-task —
  # measured doing exactly that, secondary to main, before this changed.
  - { commands: ['focus --next-active-workspace-on-monitor'], bindings: ['lwin+tab'] }
  - { commands: ['focus --prev-active-workspace-on-monitor'], bindings: ['lwin+shift+tab'] }
  # Left global on purpose: jumping back to wherever you just were is worth
  # crossing a monitor for, which is the whole point of a "recent" key.
  - { commands: ['focus --recent-workspace'], bindings: ['lwin+ctrl+tab'] }

  # Move the focused window to a workspace and follow it.
  - { commands: ['move --workspace 1',  'focus --workspace 1'],  bindings: ['lwin+shift+1'] }
  - { commands: ['move --workspace 2',  'focus --workspace 2'],  bindings: ['lwin+shift+2'] }
  - { commands: ['move --workspace 3',  'focus --workspace 3'],  bindings: ['lwin+shift+3'] }
  - { commands: ['move --workspace 4',  'focus --workspace 4'],  bindings: ['lwin+shift+4'] }
  - { commands: ['move --workspace 5',  'focus --workspace 5'],  bindings: ['lwin+shift+5'] }
  - { commands: ['move --workspace 6',  'focus --workspace 6'],  bindings: ['lwin+shift+6'] }
  - { commands: ['move --workspace 7',  'focus --workspace 7'],  bindings: ['lwin+shift+7'] }
  - { commands: ['move --workspace 8',  'focus --workspace 8'],  bindings: ['lwin+shift+8'] }
  - { commands: ['move --workspace 9',  'focus --workspace 9'],  bindings: ['lwin+shift+9'] }
  - { commands: ['move --workspace 10', 'focus --workspace 10'], bindings: ['lwin+shift+0'] }

  # Move it there without following.
  - { commands: ['move --workspace 1'],  bindings: ['lwin+shift+alt+1'] }
  - { commands: ['move --workspace 2'],  bindings: ['lwin+shift+alt+2'] }
  - { commands: ['move --workspace 3'],  bindings: ['lwin+shift+alt+3'] }
  - { commands: ['move --workspace 4'],  bindings: ['lwin+shift+alt+4'] }
  - { commands: ['move --workspace 5'],  bindings: ['lwin+shift+alt+5'] }
  - { commands: ['move --workspace 6'],  bindings: ['lwin+shift+alt+6'] }
  - { commands: ['move --workspace 7'],  bindings: ['lwin+shift+alt+7'] }
  - { commands: ['move --workspace 8'],  bindings: ['lwin+shift+alt+8'] }
  - { commands: ['move --workspace 9'],  bindings: ['lwin+shift+alt+9'] }
  - { commands: ['move --workspace 10'], bindings: ['lwin+shift+alt+0'] }

binding_modes:
  - name: 'resize'
    keybindings:
      - { commands: ['resize --width -2%'],  bindings: ['h', 'left'] }
      - { commands: ['resize --width +2%'],  bindings: ['l', 'right'] }
      - { commands: ['resize --height +2%'], bindings: ['k', 'up'] }
      - { commands: ['resize --height -2%'], bindings: ['j', 'down'] }
      - { commands: ['wm-disable-binding-mode --name resize'], bindings: ['escape', 'enter'] }
