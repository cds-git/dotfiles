[opener]
edit = [
	{ run = 'nvim "$@"', block = true, for = "unix" },
	{ run = 'nvim "%*"', block = true, for = "windows" },
]
folder = [
	{ run = 'nvim "$@"', block = true, for = "unix" },
	{ run = 'nvim "%*"', block = true, for = "windows" },
]

[open]
prepend_rules = [
	# yazi renamed this rule key from `name` to `url`; the old key now errors
	# with "at least one of `url` or `mime` must be specified".
	{ url = "*/", use = "folder" },
]
